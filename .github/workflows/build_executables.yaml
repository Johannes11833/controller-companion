name: Build Executables

on:
  push:
    tags:
      - "v*"

env:
  APP_NAME: controller-companion
  VERSION:  ${{ github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: "dist/*.zip, dist/*.exe"
          - os: ubuntu-latest
            artifacts: "dist/*.zip, dist/*.deb"
          - os: macos-latest
            artifacts: "dist/*.zip"


    steps:
    - name: Set poetry version name (remove v prefix)
      run: |
        echo "VERSION_POETRY=${VERSION#v}" >> $GITHUB_ENV
      shell: bash
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10.x

    - name: Install Inno Setup
      if: matrix.os == 'windows-latest'
      run: choco install innosetup

    - name: Install package & update version
      run: |
        pip install poetry
        poetry version "${{env.VERSION_POETRY}}"
        poetry install --with dev

    - name: Build executable
      run: |
        poetry run build_controller_companion_exe
        ls -R ./dist/

    - name: Build Installer (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' inno_setup.iss /DAppVersion=${{env.VERSION_POETRY}}
        ls ./dist/

    - name: Build Deb File (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: ./create_deb.sh dist/controller-companion

    # the matrix jobs race to create the release; the first one generates the
    # release notes, the later ones only update it and keep the notes intact
    - name: Create Artifact
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ matrix.artifacts }}
        allowUpdates: true
        generateReleaseNotes: true
        omitBodyDuringUpdate: true

  # publish to PyPI only after all executables were built successfully
  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/controller-companion/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve poetry version name (remove v prefix)
        run: echo "VERSION_POETRY=${VERSION#v}" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: pip install poetry
      - name: Update version and install project
        run: |
          poetry version "${{env.VERSION_POETRY}}"
          poetry install --sync --no-interaction
      - name: Package project
        run: poetry build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1