[tool.poetry]
name = "controller-companion"
version = "0.8.2"
description = "Python app for assigning shortcut actions to game controllers."
authors = [
    "Johannes Gundlach <24914225+Johannes11833@users.noreply.github.com>",
]
readme = "README.md"
homepage = "https://github.com/Johannes11833/controller-companion"
repository = "https://github.com/Johannes11833/controller-companion"
include = ["controller_companion/app/res/*"]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/Johannes11833/controller-companion/issues"
"Changelog" = "https://github.com/Johannes11833/controller-companion/releases"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pygame = "^2.6.1"
pillow = "^11.0.0"
pyautogui = "^0.9.54"
requests = "^2.32.3"
rich = "^13.9.4"
pyside6-essentials = "^6.12.0"
# Linux only: pyautogui -> mouseinfo depends on the abandoned python3-xlib 0.15, which
# cannot match Xwayland's Xauthority cookie (empty display number) on GNOME/Wayland.
# python-xlib 0.33 provides the same Xlib module and handles that case. Unused on Windows.
python-xlib = { version = "^0.33", markers = "sys_platform == 'linux'" }


[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
controller_companion = "controller_companion.launch:cli"
build_controller_companion_exe = "pyinstaller:install"
